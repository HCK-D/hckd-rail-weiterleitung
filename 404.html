<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>RailBase ist umgezogen</title>
<link rel="canonical" href="https://railbase.ch/">
<noscript><meta http-equiv="refresh" content="0;url=https://railbase.ch/"></noscript>
<script>
/* hckd-rail.ch ist jetzt railbase.ch.
   Leitet jede alte Adresse auf die gleiche Seite bei railbase.ch weiter. Sammlung, Sichtungen
   und Einstellungen liegen im Browser getrennt pro Adresse; sie reisen einmal als #umzug=… mit
   (der Teil nach # wird nie an einen Server geschickt) und railbase.ch übernimmt sie. */
(function () {
  var url = 'https://railbase.ch' + location.pathname + location.search;
  var hash = location.hash.slice(1), daten = {}, n = 0;
  try {
    if (!localStorage.getItem('hckd-umgezogen')) {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (/^hckd-/.test(k) && k !== 'hckd-meldungen') { daten[k] = localStorage.getItem(k); n++; }
      }
      localStorage.setItem('hckd-umgezogen', '1');
    }
  } catch (e) { /* private window: nothing to take along */ }
  if (n) {
    var bytes = new TextEncoder().encode(JSON.stringify(daten)), s = '';
    for (var j = 0; j < bytes.length; j++) s += String.fromCharCode(bytes[j]);
    url += '#umzug=' + btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') + (hash ? '&h=' + encodeURIComponent(hash) : '');
  } else if (hash) {
    url += '#' + hash;
  }
  location.replace(url);
})();
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#F5F6F7;color:#202326;font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
  b{color:#D71920}
  a{color:#D71920;font-weight:700}
  @media (prefers-color-scheme:dark){body{background:#15171A;color:#F2F3F4}}
</style>
</head>
<body>
<main>
  <p><b>RailBase</b> ist jetzt unter <a href="https://railbase.ch/">railbase.ch</a> zu finden.</p>
  <p lang="fr">RailBase se trouve désormais sur <a href="https://railbase.ch/">railbase.ch</a>.</p>
  <p lang="it">RailBase ora si trova su <a href="https://railbase.ch/">railbase.ch</a>.</p>
  <p lang="en">RailBase has moved to <a href="https://railbase.ch/">railbase.ch</a>.</p>
</main>
</body>
</html>
